<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="title">Yahoo Mail UI Enhancer</title>
    <link rel="stylesheet" href="src/popup.css">
  </head>
  <body>
    <main>
      <h1 id="title-heading">Yahoo Mail UI Enhancer</h1>
      <section aria-labelledby="status-heading" class="status-card">
        <h2 id="status-heading">Current page</h2>
        <p id="status" aria-live="polite">Checking</p>
        <dl id="effect-status" hidden>
          <div><dt id="sidebar-status-label">Sidebar</dt><dd id="sidebar-status"></dd></div>
          <div><dt id="unread-status-label">Unread emphasis</dt><dd id="unread-status"></dd></div>
        </dl>
        <p id="status-detail"></p>
      </section>
      <label><input id="sidebar-concealment" type="checkbox"> <span id="sidebar-label">Conceal Mail Sidebar</span></label>
      <label><input id="unread-emphasis" type="checkbox"> <span id="unread-label">Emphasize unread mail in dark mode</span></label>
      <p id="privacy">Your preferences and page changes stay on this device. This extension makes no network requests.</p>
      <p id="unofficial">This independent, unofficial extension is not affiliated with Yahoo.</p>
      <a id="privacy-link" href="privacy.html" target="_blank">Privacy</a>
    </main>
    <script src="src/preferences.js"></script>
    <script src="src/popup.js"></script>
  </body>
</html>
