<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title id="title">Yahoo Mail UI Enhancer</title>
    <link rel="stylesheet" href="src/popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="masthead">
        <img class="brand-mark" src="assets/icon-48.png" width="32" height="32" alt="">
        <h1 id="title-heading">Yahoo Mail UI Enhancer</h1>
      </header>
      <section id="status-card" aria-labelledby="status-heading" class="status-card" data-state="checking">
        <div class="status-heading-row">
          <h2 id="status-heading">Current page</h2>
          <p id="status" class="status-value" aria-live="polite">Checking</p>
        </div>
        <p id="status-detail"></p>
        <dl id="effect-status" hidden>
          <div><dt id="sidebar-status-label">Sidebar</dt><dd id="sidebar-status"></dd></div>
          <div><dt id="unread-status-label">Unread emphasis</dt><dd id="unread-status"></dd></div>
        </dl>
      </section>
      <div class="feature-controls">
        <label class="feature-control"><span id="sidebar-label">Conceal Mail Sidebar</span><input id="sidebar-concealment" type="checkbox"></label>
        <label class="feature-control"><span id="unread-label">Emphasize unread mail in dark mode</span><input id="unread-emphasis" type="checkbox"></label>
      </div>
      <footer class="disclosure">
        <p id="privacy">Your preferences and page changes stay on this device. This extension makes no network requests.</p>
        <p id="unofficial">This independent, unofficial extension is not affiliated with Yahoo.</p>
        <a id="privacy-link" href="privacy.html" target="_blank">Privacy</a>
      </footer>
    </main>
    <script src="src/preferences.js"></script>
    <script src="src/popup.js"></script>
  </body>
</html>
