  <rect x="252" y="368" width="976" height="60" rx="8" fill="#182235"/><text x="338" y="394" fill="#dce5f2" font-size="16">旅行規劃</text><text x="466" y="394" fill="#dce5f2" font-size="16">行程建議與住宿資訊</text><text x="338" y="416" fill="#91a1b7" font-size="14">已為你整理好下次出發的選項。</text><text x="1169" y="399" fill="#91a1b7" font-size="13">週一</text></g>
  <rect x="252" y="464" width="976" height="210" rx="12" fill="#182235"/>
