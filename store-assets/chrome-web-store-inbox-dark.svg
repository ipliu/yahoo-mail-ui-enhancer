  <circle cx="279" cy="194" r="8" fill="none" stroke="#abb9ce" stroke-width="2"/><circle cx="310" cy="194" r="7" fill="#6b5cf6"/>
  <text x="338" y="190" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">產品團隊</text><text x="466" y="190" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">本週產品更新與重要事項</text><text x="338" y="212" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="14">所有變更摘要已整理在這封信中。</text><text x="1162" y="194" fill="#c7d3e4" font-family="Arial, sans-serif" font-size="13">上午 10:24</text>
  <g font-family="Arial, sans-serif"><rect x="252" y="232" width="976" height="60" rx="8" fill="#182235"/><text x="338" y="258" fill="#dce5f2" font-size="16">設計週報</text><text x="466" y="258" fill="#dce5f2" font-size="16">八月設計評審邀請</text><text x="338" y="280" fill="#91a1b7" font-size="14">一起確認最新介面方向與回饋。</text><text x="1169" y="263" fill="#91a1b7" font-size="13">昨天</text>
