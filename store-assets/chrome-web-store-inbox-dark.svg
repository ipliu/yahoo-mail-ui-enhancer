  <circle cx="287" cy="740" r="16" fill="#6b5cf6"/><path d="M279 737h16v9h-16z" fill="#fff"/><text x="315" y="736" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">深色模式未讀信強調</text><text x="315" y="757" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="14">保留原有未讀標記，讓重要訊息更容易掃讀。</text>
