  <text x="282" y="544" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="17">隱藏右側欄，讓郵件工作區更寬敞；</text><text x="282" y="573" fill="#b9c6d8" font-family="Arial, sans-serif" font-size="17">在深色模式中，更清楚地辨識未讀訊息。</text>
