name: Deploy privacy policy to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "privacy.html"
      - "assets/icon-48.png"
      - ".github/workflows/deploy-privacy-policy.yml"

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare privacy policy site
        run: |
          mkdir -p _site/assets
          cp privacy.html _site/privacy.html
          cp assets/icon-48.png _site/assets/icon-48.png
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the generated privacy policy site
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
